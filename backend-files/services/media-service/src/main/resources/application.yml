server:
  port: 8083

spring:
  application:
    name: media-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/testimonial_cms}
    username: ${DB_USER:cms_user}
    password: ${DB_PASSWORD:cms_pass}

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key:    ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

youtube:
  api-key: ${YOUTUBE_API_KEY}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.testimonialcms.media: DEBUG
