server:
  port: 8086

spring:
  application:
    name: embed-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/testimonial_cms}
    username: ${DB_USER:cms_user}
    password: ${DB_PASSWORD:cms_pass}

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

services:
  testimonial-url: ${TESTIMONIAL_SERVICE_URL:http://localhost:8082}

embed:
  base-url: ${EMBED_BASE_URL:http://localhost:8086}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.testimonialcms.embed: DEBUG
